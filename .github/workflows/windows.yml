name: windows
on:
  push:
    branches: [windows, main, "mikey-*"]
    tags: ['v*']
    paths: [Engine/**, Tools/autoswitch/**, Windows/**, .github/workflows/windows.yml]
  pull_request:
    paths: [Engine/**, Tools/autoswitch/**, Windows/**, .github/workflows/windows.yml]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to package for and upload to (e.g. v1.0.14)"
        required: false
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: choco install ninja -y --no-progress
        shell: pwsh
      - name: Engine lock (rule cases, golden, Telex lock, driver parity, perf)
        run: pwsh Windows/check.ps1
        shell: pwsh
      - name: Build app (version from project.yml, like the Mac app)
        if: hashFiles('Windows/App/CMakeLists.txt') != ''
        run: |
          $ver = (Select-String -Path project.yml -Pattern 'MARKETING_VERSION: "([^"]+)"').Matches[0].Groups[1].Value
          "VIKEY_VERSION=$ver" >> $env:GITHUB_ENV
          cmake -S Windows -B Windows/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build Windows/build --config Release --target mikey mikey_livetest
        shell: pwsh
      # Real typing through MiKey's keyboard hook: the test types with SendInput into its own window and reads the
      # text back. US layout (Windows/Tests/cases.tsv), then Swiss German (cases_ch.tsv: ü ö ä é on their own keys).
      - name: Live typing test (US and Swiss German keyboard)
        if: hashFiles('Windows/App/CMakeLists.txt') != ''
        run: |
          New-Item -Path HKCU:\Software\MiKey -Force | Out-Null
          Set-ItemProperty -Path HKCU:\Software\MiKey -Name FirstRunDone -Value 1 -Type DWord   # no welcome window over the test
          Start-Process -FilePath Windows/build/App/MiKey.exe
          Start-Sleep -Seconds 5
          if (-not (Get-Process MiKey -ErrorAction SilentlyContinue)) { throw "MiKey.exe did not start" }
          $fail = 0
          & Windows/build/App/mikey_livetest.exe Windows/Tests/cases.tsv; if ($LASTEXITCODE) { $fail = 1 }
          & Windows/build/App/mikey_livetest.exe Windows/Tests/cases_ch.tsv 00000807; if ($LASTEXITCODE) { $fail = 1 }
          Stop-Process -Name MiKey -Force -ErrorAction SilentlyContinue
          exit $fail
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: hashFiles('Windows/App/CMakeLists.txt') != ''
        with:
          name: MiKey-windows-${{ matrix.arch }}
          path: Windows/build/App/MiKey.exe

  # Tag v<version> (pushed by Tools/release/release.sh): installers + portable zips onto the GitHub release.
  package:
    needs: engine
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
      CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: "Code signing tool (ssign - Certum SimplySign cloud cert, headless)"
        if: env.CERTUM_OTP != ''
        run: |
          Invoke-WebRequest -Uri https://github.com/Le-Syl21/ssign/releases/download/v0.1.8/ssign-windows-x86_64.zip -OutFile ssign.zip
          Expand-Archive ssign.zip -DestinationPath ssign
          $exe = (Get-ChildItem ssign -Recurse -Filter ssign.exe | Select-Object -First 1).FullName
          "SSIGN=$exe" >> $env:GITHUB_ENV
        shell: pwsh
      - name: Installers (Inno Setup) + portable zips, signed when the certificate secrets exist
        run: |
          $ver = (Select-String -Path project.yml -Pattern 'MARKETING_VERSION: "([^"]+)"').Matches[0].Groups[1].Value
          "$ver" | Out-Host
          New-Item -ItemType Directory -Force dist | Out-Null
          function Sign($file) {
            if (-not $env:SSIGN) { "unsigned: $file (no CERTUM_OTP secret)" | Out-Host; return }
            & $env:SSIGN $file
            if ($LASTEXITCODE -ne 0) { throw "signing failed: $file" }
          }
          foreach ($arch in @('x64', 'arm64')) {
            $src = "artifacts/MiKey-windows-$arch"
            Sign "$src/MiKey.exe"
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=$ver" "/DArch=$arch" "/DSrc=$((Resolve-Path $src).Path)" Windows/installer/MiKey.iss
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Sign "Windows/installer/out/MiKey-$ver-$arch-Setup.exe"
            Move-Item "Windows/installer/out/MiKey-$ver-$arch-Setup.exe" dist/
            Compress-Archive -Path "$src/MiKey.exe" -DestinationPath "dist/MiKey-$ver-$arch-portable.zip"
          }
          Get-ChildItem dist | Out-Host
        shell: pwsh
      - name: Upload to the release
        run: gh release upload "${{ inputs.release_tag || github.ref_name }}" dist/* --clobber -R ${{ github.repository }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
