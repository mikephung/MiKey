name: MiKey
options:
  bundleIdPrefix: com.mikey
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.10"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  MiKey:
    type: application
    platform: macOS
    dependencies:
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
      - package: Sparkle
    sources:
      - path: App
      - path: Engine
        excludes:
          - "platforms/win32.h"
          - "platforms/linux.h"
    settings:
      base:
        PRODUCT_NAME: MiKey
        PRODUCT_BUNDLE_IDENTIFIER: com.mikey.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MiKey.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/Core/MiKey-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Engine", "$(SRCROOT)/Engine/platforms"]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
